[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joutputmunch"
version = "0.1.0"
description = "Benchmark harness for the jOutputMunch output-token rules. The rules themselves are Markdown and need no install."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]

[project.scripts]
joutputmunch-bench = "joutputmunch.bench.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/joutputmunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
